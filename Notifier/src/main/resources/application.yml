spring:
  application:
    name: notifier-service

  # Import additional configuration files
  # file: legge da WORKDIR (/app) — necessario per il volume mount in docker
  # classpath: come fallback per dev/test quando il file è nel JAR
  config:
    import:
      - optional:file:./notifications.yml
      - optional:classpath:notifications.yml

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://postgres-service:5432/berlinkdb
    username: berlink
    password: berlink
    driver-class-name: org.postgresql.Driver

  # Mail Configuration (SMTP with SSL on port 465)
  mail:
    host: smtp.mail.it
    port: 1234
    username: a
    password: a
    protocol: smtps
    properties:
      mail:
        smtps:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        smtp:
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# Email Sender Configuration
email:
  # API key valide per l'endpoint REST POST /email (header X-API-Key).
  # Lista: può contenere più chiavi. Default file = una chiave.
  # Override in prod via env EMAIL_API_KEYS (valori multipli separati da virgola).
  api:
    keys: 
      - test_3fb44709-46e6-4725-b8de-b7e3993e0363
  from:
    address: noreply@gruppobernardini.it
    name: "BERLink"
  footer: |

    Messaggio generato automaticamente dal sistema. Si prega di non rispondere a questa email, la casella di posta non è monitorata.
    Per assistenza contattare: support@gruppobernardini.it

# Backend API Configuration
# Usata internamente (EmailService) per scaricare/eliminare allegati via hostname docker.
backend:
  api:
    url: http://backend:8080                        # URL di BERLink BE (hostname INTERNO docker)
    api-key: 0e5cfec5-ad39-45c6-b3af-92e9c77dfcf8   # API Key per automazione
    attachments:
      download-endpoint: /api/attachments/{id}/download

# BERLink API raggiungibile DALL'ESTERNO (servizio WhatsApp).
# base-url: URL pubblico di BERLink (NON http://backend:8080 interno).
# api-key: chiave accettata da QUELLA istanza, usata come ?token nel link download allegato.
# base-url e api-key devono appartenere alla STESSA istanza.
berlink:
  api:
    base-url: http://192.168.0.12:8090
    api-key: d2c6aba0-3779-4bca-82ae-e731f35a3ec4

# WhatsApp Configuration (bernardini-os)
# Usata per la condivisione allegati (evento attachment:share con campo "phone").
# image-url: allegato con estensione immagine. file-url: allegato generico/documento.
# token: Bearer per header Authorization.
# Il link download dell'allegato si costruisce da berlink.api (base-url + api-key).
# dry-run=true: nessuna chiamata REST, solo log.
whatsapp:
  # url: messaggio testo. image-url: immagine. file-url: documento/file generico.
  url: https://bernardini-os.fiai.pro/api/whatsapp/send-message
  image-url: https://bernardini-os.fiai.pro/api/whatsapp/send-image
  file-url: https://bernardini-os.fiai.pro/api/whatsapp/send-document
  token: fiai-10ad376fb71badb1d6b5618acabaf8c480b7c5479c9c1998ef63db4384dcfba4
  account: main
  # true: nessuna chiamata REST, solo log. false: invio reale.
  dry-run: false

# Valkey (Redis) Configuration
valkey:
  host: valkey-service
  port: 6379
  database: 0
  password: # Leave empty if no password

# Health Check Contract (BERLink HEALTH_CONTRACT.md)
# Chiave per /api/health/ready (X-API-Key). Override in prod via env HEALTH_API_KEY.
health:
  api-key: ${HEALTH_API_KEY:change-me-notifier-health-key}

# Actuator Configuration (Health Checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.containermgmt.notifier: DEBUG
    org.javalite.activejdbc: INFO
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
