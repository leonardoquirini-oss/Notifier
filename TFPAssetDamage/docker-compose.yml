version: '3.8'

services:
  # TFP Asset Damage Collector Service
  coll:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tfp-asset-damage-collector
    hostname: tfp-asset-damage-collector
    restart: unless-stopped
    ports:
      - 9229:9229
      - 3010:3000
    environment:
      # Scheduling
      - CRON_SCHEDULE=36 9 * * *
      - TZ=Europe/Rome

      # Health (HEALTH_CONTRACT.md)
      - HEALTH_PORT=3000
      - HEALTH_API_KEY=${HEALTH_API_KEY:-tfp-health-key-2026-DO-NOT-USE-IN-PRODUCTION}
      - APP_VERSION=1.0.0

      # Redis
      - REDIS_HOST=valkey-service
      - REDIS_PORT=6379
      - REDIS_STREAM_KEY=trailer-damage-stream

      # BERLink API
      - TRAILER_API_URL=http://berlink-backend:8080
      - TRAILER_API_KEY=tfp-test-key-2025-DO-NOT-USE-IN-PRODUCTION
      - TRAILER_API_TIMEOUT=30000

      # TFP API
      - TPF_API_URL=https://tfp.circletouch.eu/api
      - TPF_API_TIMEOUT=30000
      - TPF_API_RETRY_ATTEMPTS=3
      - TPF_API_USERNAME=admin.b
      - TPF_API_PASSWORD=TB_adm_2026.

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - berlink-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  berlink-network:
    external: true
    name: berlink-dev_berlink-network