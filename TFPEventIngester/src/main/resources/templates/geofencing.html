<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TFP Event Ingester - Geofencing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        #map { height: calc(100vh - 170px); min-height: 400px; border: 1px solid #dee2e6; border-radius: .375rem; }
        .points-panel { height: calc(100vh - 170px); min-height: 400px; overflow-y: auto; }
        .pt-input { font-size: .8rem; }
        table.points-table td { padding: .25rem; vertical-align: middle; }
        table.points-table th { font-size: .75rem; }
        .gf-pin { background: none; border: none; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-3">

    <!-- Header + hamburger -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">TFP Event Ingester &mdash; Geofencing</h4>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="dropdown" title="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/events">Event Browser</a></li>
                <li><a class="dropdown-item active" href="/geofencing">Geofencing</a></li>
            </ul>
        </div>
    </div>

    <!-- Map selector bar -->
    <div class="card card-body mb-3 py-2">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
                <label class="form-label form-label-sm mb-0 me-1">Mappa</label>
            </div>
            <div class="col-auto">
                <select id="mapSelect" class="form-select form-select-sm" style="min-width:220px"></select>
            </div>
            <div class="col-auto">
                <button id="btnNewMap" class="btn btn-success btn-sm"><i class="bi bi-plus-lg"></i> Nuova</button>
                <button id="btnRenameMap" class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil"></i> Rinomina</button>
                <button id="btnDeleteMap" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Elimina</button>
            </div>
            <div class="col-auto ms-auto text-muted small" id="mapInfo"></div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Left: points list -->
        <div class="col-12 col-lg-5">
            <div class="card points-panel">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Punti</span>
                    <span class="text-muted small" id="pointsCount">0 punti</span>
                </div>
                <div class="card-body p-2">
                    <table class="table table-sm points-table mb-2">
                        <thead class="table-light">
                        <tr>
                            <th>Label</th>
                            <th style="width:90px">Lat</th>
                            <th style="width:90px">Lon</th>
                            <th style="width:80px">Raggio m</th>
                            <th style="width:46px">Col.</th>
                            <th style="width:70px"></th>
                        </tr>
                        </thead>
                        <tbody id="pointsBody"></tbody>
                        <tfoot>
                        <tr class="table-light">
                            <td><input id="newLabel" class="form-control form-control-sm pt-input" placeholder="label"></td>
                            <td><input id="newLat" type="number" step="any" class="form-control form-control-sm pt-input" placeholder="lat"></td>
                            <td><input id="newLon" type="number" step="any" class="form-control form-control-sm pt-input" placeholder="lon"></td>
                            <td><input id="newRadius" type="number" step="any" min="1" class="form-control form-control-sm pt-input" placeholder="m"></td>
                            <td><input id="newColor" type="color" value="#0d6efd" class="form-control-color p-0 border-0" style="width:24px;height:24px" title="Colore"></td>
                            <td><button id="btnAddPoint" class="btn btn-primary btn-sm w-100"><i class="bi bi-plus-lg"></i></button></td>
                        </tr>
                        </tfoot>
                    </table>
                    <div class="form-text">Suggerimento: clicca sulla mappa per precompilare lat/lon del nuovo punto.</div>
                </div>
            </div>
        </div>

        <!-- Right: map -->
        <div class="col-12 col-lg-7">
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script th:inline="none">
(function () {
    const API = '/geofencing/api';
    let currentMapId = null;
    let points = [];
    const layers = new Map(); // pointId -> {marker, circle}

    // ---- Leaflet init ----
    const map = L.map('map').setView([44.409, 8.947], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', function (e) {
        document.getElementById('newLat').value = e.latlng.lat.toFixed(6);
        document.getElementById('newLon').value = e.latlng.lng.toFixed(6);
    });

    // ---- Helpers ----
    async function jfetch(url, opts) {
        const res = await fetch(url, Object.assign({
            headers: { 'Content-Type': 'application/json' }
        }, opts));
        if (!res.ok) {
            let msg = res.statusText;
            try { const j = await res.json(); if (j.error) msg = j.error; } catch (_) {}
            throw new Error(msg);
        }
        return res.status === 204 ? null : res.json();
    }

    function num(id) {
        const v = document.getElementById(id).value;
        return v === '' ? NaN : parseFloat(v);
    }

    // ---- Maps ----
    async function loadMaps(selectId) {
        const maps = await jfetch(API + '/maps');
        const sel = document.getElementById('mapSelect');
        sel.innerHTML = '';
        maps.forEach(m => {
            const o = document.createElement('option');
            o.value = m.id; o.textContent = m.name;
            sel.appendChild(o);
        });
        if (maps.length === 0) {
            currentMapId = null;
            sel.innerHTML = '<option value="">(nessuna mappa)</option>';
            renderPoints([]);
            document.getElementById('mapInfo').textContent = '';
            return;
        }
        const target = selectId != null ? String(selectId) : sel.options[0].value;
        sel.value = target;
        currentMapId = parseInt(sel.value, 10);
        await loadPoints();
    }

    async function loadPoints() {
        if (currentMapId == null) { renderPoints([]); return; }
        points = await jfetch(API + '/maps/' + currentMapId + '/points');
        renderPoints(points);
    }

    // ---- Render ----
    function renderPoints(pts) {
        const body = document.getElementById('pointsBody');
        body.innerHTML = '';
        layers.forEach(l => { map.removeLayer(l.marker); map.removeLayer(l.circle); });
        layers.clear();
        const bounds = [];

        pts.forEach(p => {
            // table row (editable)
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td><input class="form-control form-control-sm pt-input f-label" value="' + (p.label ? escapeHtml(p.label) : '') + '"></td>' +
                '<td><input type="number" step="any" class="form-control form-control-sm pt-input f-lat" value="' + p.latitude + '"></td>' +
                '<td><input type="number" step="any" class="form-control form-control-sm pt-input f-lon" value="' + p.longitude + '"></td>' +
                '<td><input type="number" step="any" min="1" class="form-control form-control-sm pt-input f-rad" value="' + p.radius_m + '"></td>' +
                '<td><input type="color" class="form-control-color p-0 border-0 f-color" style="width:24px;height:24px" value="' + (p.color || '#0d6efd') + '" title="Colore"></td>' +
                '<td class="text-nowrap">' +
                '  <button class="btn btn-outline-success btn-sm btn-save" title="Salva"><i class="bi bi-check-lg"></i></button>' +
                '  <button class="btn btn-outline-danger btn-sm btn-del" title="Elimina"><i class="bi bi-trash"></i></button>' +
                '</td>';
            tr.querySelector('.btn-save').addEventListener('click', () => savePoint(p.id, tr));
            tr.querySelector('.btn-del').addEventListener('click', () => deletePoint(p.id));
            tr.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('input')) return;
                map.setView([p.latitude, p.longitude], Math.max(map.getZoom(), 14));
            });
            body.appendChild(tr);

            // map layers
            const color = p.color || '#0d6efd';
            const marker = L.marker([p.latitude, p.longitude], { icon: coloredPinIcon(color) }).addTo(map);
            marker.bindPopup((p.label ? escapeHtml(p.label) + '<br>' : '') +
                p.latitude + ', ' + p.longitude + '<br>r=' + p.radius_m + ' m');
            const circle = L.circle([p.latitude, p.longitude], {
                radius: p.radius_m, color: color, fillColor: color, fillOpacity: 0.15
            }).addTo(map);
            layers.set(p.id, { marker, circle });
            bounds.push([p.latitude, p.longitude]);
        });

        document.getElementById('pointsCount').textContent = pts.length + ' punti';
        if (bounds.length > 0) {
            map.fitBounds(L.latLngBounds(bounds).pad(0.3));
        }
    }

    // Pin SVG Google-style colorabile (ancora sulla punta inferiore)
    function coloredPinIcon(color) {
        const svg =
            '<svg width="26" height="38" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">' +
            '<path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" ' +
            'fill="' + color + '" stroke="#ffffff" stroke-width="1.5"/>' +
            '<circle cx="12" cy="12" r="4.5" fill="#ffffff"/></svg>';
        return L.divIcon({
            className: 'gf-pin',
            html: svg,
            iconSize: [26, 38],
            iconAnchor: [13, 38],
            popupAnchor: [0, -34]
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---- Point ops ----
    async function addPoint() {
        if (currentMapId == null) { alert('Crea prima una mappa'); return; }
        const body = {
            label: document.getElementById('newLabel').value || null,
            latitude: num('newLat'), longitude: num('newLon'), radiusM: num('newRadius'),
            color: document.getElementById('newColor').value
        };
        try {
            await jfetch(API + '/maps/' + currentMapId + '/points', { method: 'POST', body: JSON.stringify(body) });
            ['newLabel','newLat','newLon','newRadius'].forEach(id => document.getElementById(id).value = '');
            await loadPoints();
        } catch (e) { alert('Errore: ' + e.message); }
    }

    async function savePoint(id, tr) {
        const body = {
            label: tr.querySelector('.f-label').value || null,
            latitude: parseFloat(tr.querySelector('.f-lat').value),
            longitude: parseFloat(tr.querySelector('.f-lon').value),
            radiusM: parseFloat(tr.querySelector('.f-rad').value),
            color: tr.querySelector('.f-color').value
        };
        try {
            await jfetch(API + '/points/' + id, { method: 'PUT', body: JSON.stringify(body) });
            await loadPoints();
        } catch (e) { alert('Errore: ' + e.message); }
    }

    async function deletePoint(id) {
        if (!confirm('Eliminare il punto?')) return;
        try {
            await jfetch(API + '/points/' + id, { method: 'DELETE' });
            await loadPoints();
        } catch (e) { alert('Errore: ' + e.message); }
    }

    // ---- Map ops ----
    async function newMap() {
        const name = prompt('Nome nuova mappa:');
        if (!name) return;
        try {
            const m = await jfetch(API + '/maps', { method: 'POST', body: JSON.stringify({ name }) });
            await loadMaps(m.id);
        } catch (e) { alert('Errore: ' + e.message); }
    }

    async function renameMap() {
        if (currentMapId == null) return;
        const sel = document.getElementById('mapSelect');
        const name = prompt('Nuovo nome:', sel.options[sel.selectedIndex].text);
        if (!name) return;
        try {
            await jfetch(API + '/maps/' + currentMapId, { method: 'PUT', body: JSON.stringify({ name }) });
            await loadMaps(currentMapId);
        } catch (e) { alert('Errore: ' + e.message); }
    }

    async function deleteMap() {
        if (currentMapId == null) return;
        if (!confirm('Eliminare la mappa e tutti i suoi punti?')) return;
        try {
            await jfetch(API + '/maps/' + currentMapId, { method: 'DELETE' });
            await loadMaps();
        } catch (e) { alert('Errore: ' + e.message); }
    }

    // ---- Wire up ----
    document.getElementById('mapSelect').addEventListener('change', function () {
        currentMapId = this.value ? parseInt(this.value, 10) : null;
        loadPoints();
    });
    document.getElementById('btnNewMap').addEventListener('click', newMap);
    document.getElementById('btnRenameMap').addEventListener('click', renameMap);
    document.getElementById('btnDeleteMap').addEventListener('click', deleteMap);
    document.getElementById('btnAddPoint').addEventListener('click', addPoint);

    loadMaps();
})();
</script>
</body>
</html>
