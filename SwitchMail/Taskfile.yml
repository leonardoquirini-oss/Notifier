version: '3'

# Nota YAML: ogni desc e ogni comando che contiene ":" o apostrofi va quotato, altrimenti
# il parser lo legge come una chiave e il Taskfile non carica.

tasks:

  stop-sm:
    desc: "Ferma il container"
    cmds:
      - docker compose -f docker-compose.yml stop switchmail
    silent: true

  build-sm:
    desc: "Build con i test (default, cosi' la suite resta viva)"
    cmds:
      - docker compose -f docker-compose.yml build switchmail
    silent: true

  build-sm-fast:
    desc: "Build senza test, solo per emergenze"
    cmds:
      - docker compose -f docker-compose.yml build --build-arg SKIP_TESTS=true switchmail
    silent: true

  sm:
    desc: "Stop + build"
    cmds:
      - task: stop-sm
      - task: build-sm
    silent: true

  logs-sm:
    desc: "Segue i log del container"
    cmds:
      - docker compose logs -f switchmail

  up:
    desc: "Avvia il servizio"
    cmds:
      - docker compose -f docker-compose.yml up -d
    silent: true

  restart:
    desc: "Riavvia da zero"
    cmds:
      - docker compose down && docker compose -f docker-compose.yml up -d
    silent: true

  test:
    desc: "Suite completa in locale (unit + GreenMail)"
    cmds:
      - mvn -B test

  db:
    desc: "Copia il DB SQLite dal container e lo apre con sqlite3 dell'host"
    cmds:
      # L'immagine di runtime e' una jre-alpine senza sqlite3: si ispeziona una copia sull'host.
      - docker cp switchmail:/app/data/switchmail.db ./switchmail-dump.db
      - sqlite3 ./switchmail-dump.db
