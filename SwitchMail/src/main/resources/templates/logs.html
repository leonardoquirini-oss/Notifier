<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SwitchMail &mdash; Log elaborazioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
        .row-detail { background: #f8f9fa; }
        .row-detail pre { max-height: 320px; overflow: auto; margin-bottom: .5rem; }
        table.logs td { vertical-align: middle; font-size: .875rem; }
        .subject { max-width: 34rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .clickable { cursor: pointer; }
        .filters .form-label { font-weight: 500; color: #6c757d; }
        .chip-status { border-radius: 999px; font-size: .78rem; padding: .15rem .6rem; }
        .chip-status .count { font-variant-numeric: tabular-nums; opacity: .75; margin-left: .35rem; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-3">

    <!-- Header + hamburger -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">SwitchMail &mdash; Log elaborazioni</h4>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="dropdown" title="Menu">
                <i class="bi bi-list"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item active" href="/logs">Log elaborazioni</a></li>
                <li><a class="dropdown-item" href="/rules">Regole</a></li>
                <li><a class="dropdown-item" href="/ruletest">Test regola</a></li>
                <li><a class="dropdown-item" href="/accounts">Caselle</a></li>
            </ul>
        </div>
    </div>

    <div id="cryptoBanner" class="alert alert-danger d-none">
        <strong>SWITCHMAIL_CREDS_KEY non configurata:</strong> impossibile salvare o usare credenziali.
        <span class="mono" id="cryptoHint"></span>
    </div>
    <div id="alert" class="alert alert-danger d-none"></div>

    <!-- Filtri -->
    <div class="card card-body py-2 mb-3 filters">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-primary" data-preset="daGestire">
                    Da gestire <span class="badge text-bg-danger ms-1" id="badgeDaGestire">0</span>
                </button>
                <button type="button" class="btn btn-outline-secondary" data-preset="problemi">Con errori</button>
                <button type="button" class="btn btn-outline-secondary" data-preset="tutte">Tutte</button>
            </div>
            <div class="vr d-none d-md-block"></div>
            <div id="statusChips" class="d-flex flex-wrap gap-1"></div>
        </div>

        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="fAccount">Casella</label>
                <select id="fAccount" class="form-select form-select-sm"><option value="">Tutte</option></select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="fRule">Regola</label>
                <select id="fRule" class="form-select form-select-sm"><option value="">Tutte</option></select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label small mb-1" for="fText">Oggetto o mittente</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input id="fText" class="form-control" placeholder="AVVISI PARTENZA, @ferrovie.it&hellip;">
                    <button class="btn btn-outline-secondary" type="button" onclick="clearText()" title="Pulisci">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="fFrom">Dal</label>
                <input id="fFrom" type="date" class="form-control form-control-sm" onchange="reload()">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="fTo">Al</label>
                <input id="fTo" type="date" class="form-control form-control-sm" onchange="reload()">
            </div>
            <div class="col-12 col-md-1">
                <label class="form-label small mb-1" for="fLimit">Righe</label>
                <select id="fLimit" class="form-select form-select-sm" onchange="reload()">
                    <option>25</option>
                    <option selected>50</option>
                    <option>100</option>
                    <option>200</option>
                </select>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
            <small id="filterSummary" class="text-muted"></small>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link btn-sm p-0" onclick="resetFilters()">Azzera filtri</button>
                <small id="resultInfo" class="text-muted"></small>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 mb-2">
        <button class="btn btn-outline-primary btn-sm" onclick="retrySelected()">
            <i class="bi bi-arrow-clockwise"></i> Riprova selezionate
        </button>
        <span class="text-muted small align-self-center" id="selInfo"></span>
    </div>

    <div class="table-responsive">
        <table class="table table-sm table-hover bg-white logs">
            <thead class="table-light">
            <tr>
                <th style="width:2rem"><input type="checkbox" id="selAll" onclick="toggleAll(this)"></th>
                <th>Quando</th>
                <th>Casella</th>
                <th>Mittente</th>
                <th>Oggetto</th>
                <th>Stato</th>
                <th>Regola</th>
                <th>Tent.</th>
                <th style="width:12rem">Azioni</th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
    <button id="more" class="btn btn-outline-secondary btn-sm d-none" onclick="loadMore()">Carica altre</button>
</div>

<!-- Modale "vedi parsed" -->
<div class="modal fade" id="parsedModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Mail come l'ha vista il parser</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body mono" id="parsedBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ---- Helpers (copiati da TFPEventIngester/geofencing.html) ----
    async function jfetch(url, opts) {
        const res = await fetch(url, Object.assign({
            headers: { 'Content-Type': 'application/json' }
        }, opts));
        if (!res.ok) {
            let msg = res.statusText;
            try { const j = await res.json(); if (j.error) msg = j.error; } catch (_) {}
            throw new Error(msg);
        }
        return res.status === 204 ? null : res.json();
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showError(e) {
        const box = document.getElementById('alert');
        box.textContent = e.message || String(e);
        box.classList.remove('d-none');
        setTimeout(() => box.classList.add('d-none'), 8000);
    }

    // Lo storage e' in UTC: la formattazione in orario locale avviene qui, mai in Java.
    function localTime(iso) {
        return iso ? new Date(iso).toLocaleString('it-IT') : '';
    }

    const STATUSES = [
        { key: 'DEAD_LETTER',     label: 'Dead letter',  color: 'danger' },
        { key: 'NO_RULE',         label: 'Senza regola', color: 'warning' },
        { key: 'RETRY_SCHEDULED', label: 'In retry',     color: 'info' },
        { key: 'IN_PROGRESS',     label: 'In corso',     color: 'primary' },
        { key: 'SUCCESS',         label: 'Riuscite',     color: 'success' },
        { key: 'SKIPPED',         label: 'Saltate',      color: 'secondary' },
        { key: 'RESOLVED',        label: 'Risolte',      color: 'dark' }
    ];

    const BADGE = {
        SUCCESS: 'success', SKIPPED: 'secondary', NO_RULE: 'warning text-dark',
        RETRY_SCHEDULED: 'info text-dark', DEAD_LETTER: 'danger', IN_PROGRESS: 'primary', RESOLVED: 'dark'
    };

    const PRESETS = {
        daGestire: ['DEAD_LETTER', 'NO_RULE'],
        problemi: ['DEAD_LETTER', 'RETRY_SCHEDULED'],
        tutte: []                                    // nessuno selezionato = nessun filtro di stato
    };

    let cursor = null;
    let loaded = 0;
    let selectedStatuses = new Set(PRESETS.daGestire);
    let counts = {};
    let textTimer = null;

    // Chip al posto del multi-select: un click, stato visibile a colpo d'occhio, e il numero di
    // righe per stato sul filtro stesso invece che in una fila separata di riquadri.
    function renderChips() {
        document.getElementById('statusChips').innerHTML = STATUSES.map(st => {
            const on = selectedStatuses.has(st.key);
            const n = counts[st.key] || 0;
            return '<button type="button" class="btn btn-sm chip-status ' +
                (on ? 'btn-' + st.color : 'btn-outline-' + st.color) + '" ' +
                'onclick="toggleStatus(&quot;' + st.key + '&quot;)" title="' + st.key + '">' +
                st.label + '<span class="count">' + n + '</span></button>';
        }).join('');
        document.getElementById('badgeDaGestire').textContent =
            (counts.DEAD_LETTER || 0) + (counts.NO_RULE || 0);
        document.querySelectorAll('[data-preset]').forEach(b =>
            b.classList.toggle('active', sameSet(PRESETS[b.dataset.preset], selectedStatuses)));
    }

    function sameSet(list, set) {
        return list.length === set.size && list.every(v => set.has(v));
    }

    function toggleStatus(key) {
        if (selectedStatuses.has(key)) selectedStatuses.delete(key);
        else selectedStatuses.add(key);
        renderChips();
        reload();
    }

    function preset(statuses) {
        selectedStatuses = new Set(statuses);
        renderChips();
        reload();
    }

    function clearText() {
        document.getElementById('fText').value = '';
        reload();
    }

    function resetFilters() {
        document.getElementById('fAccount').value = '';
        document.getElementById('fRule').value = '';
        document.getElementById('fText').value = '';
        document.getElementById('fFrom').value = '';
        document.getElementById('fTo').value = '';
        document.getElementById('fLimit').value = '50';
        preset(PRESETS.daGestire);
    }

    // Le date si scelgono in locale ma il filtro lavora sugli ISO UTC salvati: la conversione sta
    // qui, cosi' "dal 18/09" comprende davvero tutta la giornata del 18 come la vede l'utente.
    function dayStartIso(value) {
        return value ? new Date(value + 'T00:00:00').toISOString() : null;
    }

    function dayEndIso(value) {
        return value ? new Date(value + 'T23:59:59.999').toISOString() : null;
    }

    function filters() {
        const p = new URLSearchParams();
        const account = document.getElementById('fAccount').value;
        if (account) p.append('accountId', account);
        selectedStatuses.forEach(st => p.append('status', st));
        const rule = document.getElementById('fRule').value;
        if (rule) p.append('ruleId', rule);
        const text = document.getElementById('fText').value.trim();
        if (text) p.append('text', text);
        const from = dayStartIso(document.getElementById('fFrom').value);
        if (from) p.append('from', from);
        const to = dayEndIso(document.getElementById('fTo').value);
        if (to) p.append('to', to);
        p.append('limit', document.getElementById('fLimit').value);
        return p;
    }

    /** Riga leggibile con i filtri attivi: senza, non si capisce perche' la tabella sia vuota. */
    function describeFilters() {
        const parts = [];
        parts.push(selectedStatuses.size ? 'stati: ' + [...selectedStatuses].join(', ') : 'tutti gli stati');

        const account = document.getElementById('fAccount');
        if (account.value) parts.push('casella: ' + account.options[account.selectedIndex].text);
        const rule = document.getElementById('fRule');
        if (rule.value) parts.push('regola: ' + rule.options[rule.selectedIndex].text);
        const text = document.getElementById('fText').value.trim();
        if (text) parts.push('testo: "' + text + '"');
        const from = document.getElementById('fFrom').value;
        const to = document.getElementById('fTo').value;
        if (from && to) parts.push('dal ' + from + ' al ' + to);
        else if (from) parts.push('dal ' + from);
        else if (to) parts.push('fino al ' + to);

        document.getElementById('filterSummary').textContent = parts.join(' · ');
    }

    async function reload() {
        cursor = null;
        loaded = 0;
        document.getElementById('rows').innerHTML = '';
        describeFilters();
        await loadMore();
    }

    async function loadMore() {
        try {
            const p = filters();
            if (cursor) { p.append('cursorCreatedAt', cursor.createdAt); p.append('cursorId', cursor.id); }
            const page = await jfetch('/logs/api?' + p.toString());
            page.rows.forEach(renderRow);
            loaded += page.rows.length;
            cursor = page.nextCursorId ? { createdAt: page.nextCursorCreatedAt, id: page.nextCursorId } : null;
            document.getElementById('more').classList.toggle('d-none', !cursor);
            document.getElementById('resultInfo').textContent =
                loaded + (loaded === 1 ? ' riga' : ' righe') + (cursor ? ' (ce ne sono altre)' : '');
            if (!loaded) {
                document.getElementById('rows').innerHTML =
                    '<tr><td colspan="9" class="text-center text-muted py-4">' +
                    'Nessuna riga con questi filtri &mdash; ' +
                    '<button class="btn btn-link btn-sm p-0 align-baseline" onclick="resetFilters()">' +
                    'azzerali</button></td></tr>';
            }
        } catch (e) { showError(e); }
    }

    function renderRow(r) {
        const tr = document.createElement('tr');
        tr.innerHTML =
            '<td><input type="checkbox" class="sel" value="' + r.id + '" onchange="updateSel()"></td>' +
            '<td class="text-nowrap">' + localTime(r.createdAt) + '</td>' +
            '<td>' + escapeHtml(r.accountName || '') + '</td>' +
            '<td>' + escapeHtml(r.mailFrom || '') + '</td>' +
            '<td class="subject clickable" onclick="toggleDetail(' + r.id + ')" title="' +
                escapeHtml(r.mailSubject || '') + '">' + escapeHtml(r.mailSubject || '(senza oggetto)') + '</td>' +
            '<td><span class="badge text-bg-' + (BADGE[r.status] || 'secondary') + '">' + r.status + '</span></td>' +
            '<td>' + escapeHtml(r.ruleName || '') + '</td>' +
            '<td>' + r.attempt + '/' + r.maxAttempts + '</td>' +
            '<td class="text-nowrap">' +
                '<button class="btn btn-outline-primary btn-sm" title="Riprova" onclick="retryOne(' + r.id + ')">' +
                    '<i class="bi bi-arrow-clockwise"></i></button> ' +
                '<button class="btn btn-outline-success btn-sm" title="Segna risolta" onclick="resolve(' + r.id + ')">' +
                    '<i class="bi bi-check2"></i></button> ' +
                (r.rawAvailable
                    ? '<a class="btn btn-outline-secondary btn-sm" title="Scarica .eml" href="/logs/api/' + r.id +
                      '/eml"><i class="bi bi-download"></i></a> ' +
                      '<button class="btn btn-outline-secondary btn-sm" title="Vedi parsed" onclick="parsed(' +
                      r.id + ')"><i class="bi bi-eye"></i></button>'
                    : '<span class="text-muted small">no MIME</span>') +
            '</td>';
        document.getElementById('rows').appendChild(tr);

        const detail = document.createElement('tr');
        detail.className = 'row-detail d-none';
        detail.id = 'detail-' + r.id;
        detail.innerHTML = '<td colspan="9"><div class="small">Caricamento&hellip;</div></td>';
        document.getElementById('rows').appendChild(detail);
    }

    async function toggleDetail(id) {
        const row = document.getElementById('detail-' + id);
        if (!row.classList.contains('d-none')) { row.classList.add('d-none'); return; }
        row.classList.remove('d-none');
        try {
            const d = await jfetch('/logs/api/' + id);
            const e = d.entry;
            let html = '<dl class="row small mb-2">';
            html += '<dt class="col-sm-2">Messaggio</dt><dd class="col-sm-10">' + escapeHtml(e.message || '') + '</dd>';
            if (e.actionRef) html += '<dt class="col-sm-2">Azione</dt><dd class="col-sm-10 mono">' +
                escapeHtml(e.actionRef) + '</dd>';
            html += '<dt class="col-sm-2">Identita&#39;</dt><dd class="col-sm-10 mono">' +
                escapeHtml(e.folder) + ' uidvalidity=' + e.uidValidity + ' uid=' + e.uid + '</dd>';
            if (e.nextRetryAt) html += '<dt class="col-sm-2">Prossimo retry</dt><dd class="col-sm-10">' +
                localTime(e.nextRetryAt) + '</dd>';
            if (e.resolvedNote) html += '<dt class="col-sm-2">Nota</dt><dd class="col-sm-10">' +
                escapeHtml(e.resolvedNote) + '</dd>';
            html += '</dl>';

            if (e.warnings && e.warnings.length) {
                html += '<div class="alert alert-warning py-2 small">' +
                    e.warnings.map(escapeHtml).join('<br>') + '</div>';
            }
            if (e.extractedJson) {
                let pretty = e.extractedJson;
                try { pretty = JSON.stringify(JSON.parse(e.extractedJson), null, 2); } catch (_) {}
                html += '<div class="small fw-semibold">Dati estratti</div><pre class="mono">' +
                    escapeHtml(pretty) + '</pre>';
            }
            if (e.errorType) {
                html += '<div class="small fw-semibold text-danger">Errore: ' + escapeHtml(e.errorType) + '</div>' +
                    '<div class="small">' + escapeHtml(e.errorMessage || '') + '</div>';
                if (e.errorStack) {
                    html += '<details class="mt-1"><summary class="small">stack trace</summary><pre class="mono">' +
                        escapeHtml(e.errorStack) + '</pre></details>';
                }
            }
            if (d.attempts && d.attempts.length) {
                html += '<div class="small fw-semibold mt-2">Tentativi</div><ul class="small mb-0">';
                d.attempts.forEach(a => {
                    html += '<li>#' + a.attempt + ' ' + a.status + ' (' + a.triggeredBy + ') ' +
                        (a.errorType ? '<span class="text-danger">' + escapeHtml(a.errorType) + '</span> ' : '') +
                        escapeHtml(a.message || a.errorMessage || '') +
                        (a.durationMs != null ? ' &mdash; ' + a.durationMs + ' ms' : '') + '</li>';
                });
                html += '</ul>';
            }
            row.innerHTML = '<td colspan="9">' + html + '</td>';
        } catch (e) { showError(e); }
    }

    async function retryOne(id) {
        try {
            await jfetch('/logs/api/' + id + '/retry', { method: 'POST' });
            await reload();
            await loadCounts();
        } catch (e) { showError(e); }
    }

    async function retrySelected() {
        const ids = [...document.querySelectorAll('.sel:checked')].map(c => parseInt(c.value, 10));
        if (!ids.length) { showError(new Error('nessuna riga selezionata')); return; }
        try {
            const r = await jfetch('/logs/api/retry', { method: 'POST', body: JSON.stringify({ ids }) });
            await reload();
            await loadCounts();
            alert('Riprovate ' + r.retried + ' righe su ' + r.requested);
        } catch (e) { showError(e); }
    }

    async function resolve(id) {
        const note = prompt('Nota (perche\' e\' risolta?)');
        if (note === null) return;
        try {
            await jfetch('/logs/api/' + id + '/resolve', { method: 'POST', body: JSON.stringify({ note }) });
            await reload();
            await loadCounts();
        } catch (e) { showError(e); }
    }

    async function parsed(id) {
        try {
            const m = await jfetch('/logs/api/' + id + '/parsed');
            let html = '<dl class="row small">' +
                '<dt class="col-sm-3">Da</dt><dd class="col-sm-9">' + escapeHtml(m.fromFull || '') + '</dd>' +
                '<dt class="col-sm-3">Oggetto</dt><dd class="col-sm-9">' + escapeHtml(m.subject || '') + '</dd>' +
                '<dt class="col-sm-3">Ricevuta</dt><dd class="col-sm-9">' + localTime(m.receivedAt) + '</dd>' +
                '</dl>';
            if (m.warnings && m.warnings.length) {
                html += '<div class="alert alert-warning py-2 small">' +
                    m.warnings.map(escapeHtml).join('<br>') + '</div>';
            }
            html += '<div class="fw-semibold small">Allegati (' + m.attachments.length + ')</div>';
            if (m.attachments.length) {
                html += '<table class="table table-sm"><thead><tr><th>Nome</th><th>Tipo</th><th>Charset</th>' +
                    '<th>Byte</th></tr></thead><tbody>';
                m.attachments.forEach(a => {
                    html += '<tr><td>' + escapeHtml(a.fileName || '(senza nome)') + '</td><td>' +
                        escapeHtml(a.contentType || '') + '</td><td>' + escapeHtml(a.charset || '') + '</td><td>' +
                        a.sizeBytes + (a.truncated ? ' <span class="badge text-bg-warning">troncato</span>' : '') +
                        '</td></tr>';
                });
                html += '</tbody></table>';
            }
            html += '<div class="fw-semibold small">Corpo</div><pre class="mono">' +
                escapeHtml(m.bodyText || '') + '</pre>';
            document.getElementById('parsedBody').innerHTML = html;
            new bootstrap.Modal(document.getElementById('parsedModal')).show();
        } catch (e) { showError(e); }
    }

    function toggleAll(box) {
        document.querySelectorAll('.sel').forEach(c => c.checked = box.checked);
        updateSel();
    }

    function updateSel() {
        const n = document.querySelectorAll('.sel:checked').length;
        document.getElementById('selInfo').textContent = n ? n + ' selezionate' : '';
    }

    async function loadCounts() {
        try {
            counts = await jfetch('/logs/api/counts');
            renderChips();
        } catch (_) { /* i contatori non devono rompere la pagina */ }
    }

    async function init() {
        try {
            const crypto = await jfetch('/accounts/api/crypto');
            if (!crypto.configured) {
                document.getElementById('cryptoHint').textContent = crypto.hint;
                document.getElementById('cryptoBanner').classList.remove('d-none');
            }
            const accounts = await jfetch('/accounts/api');
            accounts.forEach(a => {
                const o = document.createElement('option');
                o.value = a.id; o.textContent = a.name;
                document.getElementById('fAccount').appendChild(o);
            });
            const rules = await jfetch('/rules/api');
            rules.forEach(r => {
                const o = document.createElement('option');
                o.value = r.id; o.textContent = r.name;
                document.getElementById('fRule').appendChild(o);
            });
        } catch (e) { showError(e); }
        document.querySelectorAll('[data-preset]').forEach(b =>
            b.addEventListener('click', () => preset(PRESETS[b.dataset.preset])));
        document.getElementById('fAccount').addEventListener('change', reload);
        document.getElementById('fRule').addEventListener('change', reload);
        // Ricerca mentre si scrive, senza bombardare il server a ogni tasto.
        document.getElementById('fText').addEventListener('input', () => {
            clearTimeout(textTimer);
            textTimer = setTimeout(reload, 400);
        });
        document.getElementById('fText').addEventListener('keydown', e => {
            if (e.key === 'Enter') { clearTimeout(textTimer); reload(); }
        });

        renderChips();
        await loadCounts();
        await reload();
        setInterval(loadCounts, 30000);
    }

    init();
</script>
</body>
</html>
