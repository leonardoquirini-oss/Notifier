spring:
  application:
    name: switchmail
  jackson:
    # Storage e API sempre in UTC. La formattazione in orario locale avviene nel browser
    # (toLocaleString('it-IT')), mai in Java: meta' della confusione nel mail processing
    # e' confusione di timezone.
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  lifecycle:
    # Un SIGTERM durante un poll finisce la mail in volo invece di lasciare una riga IN_PROGRESS orfana.
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

switchmail:
  db:
    path: ${SWITCHMAIL_DB_PATH:./data/switchmail.db}
  mail:
    store-raw: true
    raw-max-bytes: 2097152
    raw-retention-days: 30
    log-retention-days: 365
    max-attachment-bytes: 5242880
  poll:
    tick-cron: "0/30 * * * * *"
    max-concurrent-accounts: 3
    enabled: true
  retry:
    base-seconds: 60
    max-seconds: 1800
    jitter-percent: 10
    stale-claim-timeout-minutes: 10
    sweep-cron: "0 */5 * * * *"
    auto-retry-interrupted: false
    reset-lookback-days: 7
  imap:
    # ATTENZIONE: true fa stampare a jakarta.mail il comando LOGIN, password inclusa.
    debug: ${SWITCHMAIL_IMAP_DEBUG:false}
  matcher:
    regex-max-steps: 100000
    subject-max-chars: 512
    pattern-cache-size: 512
  security:
    # Nessun default: un placeholder non risolto fa fallire il context con
    # "Could not resolve placeholder", ed e' il comportamento voluto. Generare la chiave con:
    #   openssl rand -base64 32
    creds-key: ${SWITCHMAIL_CREDS_KEY}

berlink:
  api:
    base-url: ${BERLINK_BASE_URL:http://backend:8080}
    # Nessun default: una API key viva committata in git e' la trappola piu' grossa dei fratelli.
    api-key: ${BERLINK_API_KEY}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
    notification-group-code: ${BERLINK_NOTIFY_GROUP:cd}

health:
  api-key: ${HEALTH_API_KEY}

management:
  endpoints:
    web:
      exposure:
        # Mai env/configprops/heapdump: stamperebbero SWITCHMAIL_CREDS_KEY a chiunque
        # sia sulla rete Docker, e il servizio non ha auth.
        include: health,info,metrics

logging:
  level:
    it.gruppobernardini.switchmail: INFO
