spring:
  application:
    name: gate-event-processor

  # BERLink PostgreSQL: used to inspect evt_asset_damages before sending notifications.
  datasource:
    url: jdbc:postgresql://postgres-service:5432/berlinkdb
    username: berlink
    password: berlink
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
      pool-name: BerlinkDB-Pool

# Valkey (Redis) Configuration
valkey:
  host: valkey-service
  port: 6379
  database: 0
  password:

# Health Check Contract (BERLink HEALTH_CONTRACT.md)
# Chiave per /api/health/ready (X-API-Key). Override in prod via env HEALTH_API_KEY.
health:
  api-key: ${HEALTH_API_KEY:change-me-gate-event-processor-health-key}

# Actuator Configuration (Health Checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Stream Configuration
# Tutto configurabile: nome coda (key), consumer group, e tipi accettati (filter su payload.type).
stream:
  unit-events:
    key: tfp-unit-events-stream
    consumer-group: gate-event-processor-group-dev
    allowed-types:
      - GATE_IN
      - GATE_OUT      
  poll-timeout-seconds: 1

gates:
  gate-terni:
    latitude: 42.566593515583676
    longitude: 12.60330054635772
    radius: 500
    notify-group: officina-terni
  gate-fiorenzuola:
    latitude: 44.9226023312316
    longitude: 9.928303746032544
    radius: 500
    notify-group: officina-fiorenzuola

# insert into c_ntf_notification_types (id_notification_type, label, icon, color) VALUES('gate_in_with_damages',    'Verificare Danni',          'calendar',  'red');

# BERLink API: lookup unit (GET /api/units/search, /api/vehicles/by-plate/{plate})
#              + notifications (POST /api/notifications/send)
berlink:
  api:
    #base-url: http://backend:8080
    base-url: http://192.168.0.12:8090
    api-key: d2c6aba0-3779-4bca-82ae-e731f35a3ec4    
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    cache-enabled: true
    cache-ttl-minutes: 43200
    cache-negative-ttl-minutes: 15

# WhatsApp send-message endpoint (bernardini-os).
# token: Bearer token per header Authorization (override in prod via env WHATSAPP_TOKEN).
whatsapp:
  # url: messaggio testo. image-url: messaggio con allegato/immagine.
  url: http://192.168.0.14:3120/api/whatsapp/send-message
  image-url: http://192.168.0.14:3120/api/whatsapp/send-image
  #url: https://bernardini-os.fiai.pro/api/whatsapp/send-message
  #image-url: https://bernardini-os.fiai.pro/api/whatsapp/send-image
  token: fiai-10ad376fb71badb1d6b5618acabaf8c480b7c5479c9c1998ef63db4384dcfba4
  account: main
  # true: nessuna chiamata REST, solo log. false: invio reale.
  dry-run: false
  # Allegati: gli id_document dell'evento vengono ricaricati come temporanei (upload-temporary)
  # e l'URL WhatsApp punta al download temporaneo. temp-timeout-minutes = validità del file tmp.
  temp-entity-type: temporary
  temp-timeout-minutes: 60

# Logging Configuration
logging:
  level:
    root: INFO
    com.containermgmt.gateeventprocessor: DEBUG
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
